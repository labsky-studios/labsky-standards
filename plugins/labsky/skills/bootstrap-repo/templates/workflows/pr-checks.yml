# Quality gate and AI review on every push to a PR. The merge bot waits for both.
# Secrets: MERGE_BOT_TOKEN (pushes formatting fixes; also reads labsky-vault for the review),
# CLAUDE_CODE_OAUTH_TOKEN (AI review).
name: PR checks

on:
  pull_request:
    branches: [dev, staging, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  quality:
    uses: labsky-studios/labsky-standards/.github/workflows/quality.yml@v1
    with:
      # Adjust to the Commands table in CLAUDE.md.
      format-command: "pnpm format"
      check-command: "pnpm format:check"
      test-command: ""
      build-command: "pnpm build"
    secrets:
      bot-token: ${{ secrets.MERGE_BOT_TOKEN }}

  ai-review:
    uses: labsky-studios/labsky-standards/.github/workflows/ai-review.yml@v1
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      vault-token: ${{ secrets.MERGE_BOT_TOKEN }}
