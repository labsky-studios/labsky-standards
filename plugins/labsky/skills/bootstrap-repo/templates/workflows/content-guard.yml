# Holds PRs that change client content until a human adds the content-approved label.
name: Content guard

on:
  pull_request:
    branches: [dev, staging, main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: content-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  content-guard:
    uses: labsky-studios/labsky-standards/.github/workflows/content-guard.yml@v1
    with:
      # Every path that holds client content (copy, figures, dates, legal text).
      paths: |
        src/features/*/constants/*
