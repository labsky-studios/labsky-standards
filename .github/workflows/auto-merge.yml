# Reusable: the merge bot. GitHub Free has no native auto-merge for private repos, so this
# workflow checks every condition itself and merges with the bot token.
#
# It merges a PR only when:
# - its base is dev (rebase, so each commit lands as written; feature branch deleted) or it is
#   dev → staging (merge commit, so dev and staging keep the same commits);
# - it is open, not a draft, mergeable, and has no `hold` label;
# - every check on its head commit passed (skipped counts as passed), none is pending, and each
#   of `required-checks` exists — so it never merges before the checks have started.
# It never merges into main.
#
# Stacked PRs: rebasing a feature PR onto dev rewrites its commits, and GitHub moves the PRs that
# were based on its branch to dev, still carrying the old copies. The bot restacks them with
# `git rebase --onto origin/dev <old tip of the merged branch>`, which keeps only each child's
# own commits, pushes with --force-with-lease, and does the same for their children in turn.
# A real conflict is never resolved by the bot: it aborts, labels the PR `needs-restack` and
# comments on it, and the bot does not merge a PR with that label.
#
# The bot token (fine-grained, this repo only: Contents, Pull requests and Workflows: Read and write; Commit statuses: Read-only)
# makes the merge start the next workflows (promotion, deploy); a GITHUB_TOKEN merge would not.
# Without Workflows write, GitHub refuses to merge a PR that changes .github/workflows/.
#
#   on:
#     workflow_run:
#       workflows: ["PR checks", "PR rules"]
#       types: [completed]
#     pull_request:
#       types: [labeled, unlabeled, ready_for_review]
#   jobs:
#     auto-merge:
#       uses: labsky-studios/labsky-standards/.github/workflows/auto-merge.yml@v1
#       with:
#         pr-number: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || '' }}
#         head-sha: ${{ github.event.workflow_run.head_sha || '' }}
#       secrets:
#         bot-token: ${{ secrets.MERGE_BOT_TOKEN }}
#
# workflow_run only fires for the copy of the caller on the default branch (main), so the bot
# starts working once the caller reaches main.
name: Auto-merge

on:
  workflow_call:
    inputs:
      pr-number:
        description: The PR to consider. Empty to find it from head-sha.
        type: string
        default: ""
      head-sha:
        description: Head commit of the PR, used when pr-number is empty.
        type: string
        default: ""
      required-checks:
        description: Comma-separated caller job ids whose checks must exist and pass.
        type: string
        default: "quality,ai-review,content-guard,pr-description"
    secrets:
      bot-token:
        required: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.bot-token || github.token }}
      HAS_BOT_TOKEN: ${{ secrets.bot-token != '' }}
      REPO: ${{ github.repository }}
      PR: ${{ inputs.pr-number }}
      SHA: ${{ inputs.head-sha }}
      REQUIRED: ${{ inputs.required-checks }}
    steps:
      - name: Merge when everything passed
        id: merge
        run: |
          if [ "$HAS_BOT_TOKEN" != "true" ]; then
            echo "::notice::No bot-token (MERGE_BOT_TOKEN): the merge bot is off."
            exit 0
          fi

          if [ -z "$PR" ] && [ -n "$SHA" ]; then
            PR=$(gh pr list --repo "$REPO" --state open --search "$SHA" --json number --jq '.[0].number // empty')
          fi
          if [ -z "$PR" ]; then
            echo "No open PR to consider."
            exit 0
          fi

          pr=$(gh pr view "$PR" --repo "$REPO" --json state,isDraft,baseRefName,headRefName,headRefOid,labels,mergeable)
          state=$(jq -r .state <<< "$pr")
          draft=$(jq -r .isDraft <<< "$pr")
          base=$(jq -r .baseRefName <<< "$pr")
          head=$(jq -r .headRefName <<< "$pr")
          head_sha=$(jq -r .headRefOid <<< "$pr")
          mergeable=$(jq -r .mergeable <<< "$pr")
          labels=$(jq -r '[.labels[].name] | join(",")' <<< "$pr")

          skip() { echo "PR #$PR is not merged: $1"; exit 0; }

          [ "$state" = "OPEN" ] || skip "it is $state."
          [ "$draft" = "false" ] || skip "it is a draft."
          [[ ",$labels," != *",hold,"* ]] || skip "it has the hold label."
          [[ ",$labels," != *",needs-restack,"* ]] || skip "it has the needs-restack label: restack it on its base and remove the label."
          if [ -n "$SHA" ] && [ "$SHA" != "$head_sha" ]; then
            skip "the run was for $SHA, but the head is now $head_sha."
          fi

          case "$base:$head" in
            main:*) skip "PRs into main are merged by a human." ;;
            staging:dev) method="--merge" ;;
            staging:*) skip "staging only receives dev." ;;
            dev:dev|dev:staging|dev:main) skip "promotion branches never merge into dev." ;;
            dev:*) method="--rebase --delete-branch" ;;
            *) skip "no merge rule for base $base." ;;
          esac

          [ "$mergeable" != "CONFLICTING" ] || skip "it has conflicts."

          checks=$(gh pr checks "$PR" --repo "$REPO" --json name,bucket 2>/dev/null || true)
          if [ -z "$checks" ]; then
            skip "it has no checks yet."
          fi
          # The bot's own run is not a gate.
          checks=$(jq '[.[] | select(.name | test("^auto-merge( / |$)") | not)]' <<< "$checks")

          pending=$(jq '[.[] | select(.bucket == "pending")] | length' <<< "$checks")
          [ "$pending" = "0" ] || skip "$pending check(s) still running."
          failed=$(jq -r '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(", ")' <<< "$checks")
          [ -z "$failed" ] || skip "failed: $failed."

          IFS=',' read -ra required <<< "$REQUIRED"
          for job in "${required[@]}"; do
            job=$(xargs <<< "$job")
            found=$(jq --arg job "$job" '[.[] | select(.name == $job or (.name | startswith($job + " / ")))] | length' <<< "$checks")
            [ "$found" != "0" ] || skip "required check '$job' has not run on this commit."
          done

          # PRs stacked on this branch, listed before the merge deletes it.
          children='[]'
          if [ "$method" = "--rebase --delete-branch" ]; then
            children=$(gh pr list --repo "$REPO" --base "$head" --state open --json number,headRefName --jq '[.[] | {number, branch: .headRefName}]')
          fi

          echo "Merging PR #$PR ($head → $base) with $method."
          # shellcheck disable=SC2086
          if ! gh pr merge "$PR" --repo "$REPO" $method --match-head-commit "$head_sha"; then
            echo "::error::GitHub could not merge PR #$PR with $method. For a rebase, update the branch on origin/dev locally (git rebase origin/dev), push it, and the bot tries again."
            exit 1
          fi

          {
            echo "base=$base"
            echo "old-tip=$head_sha"
            echo "children=$(jq -c . <<< "$children")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.merge.outputs.children != '' && steps.merge.outputs.children != '[]'
        with:
          fetch-depth: 0
          token: ${{ secrets.bot-token }}

      - name: Restack PRs that were stacked on the merged branch
        if: steps.merge.outputs.children != '' && steps.merge.outputs.children != '[]'
        env:
          BASE: ${{ steps.merge.outputs.base }}
          OLD_TIP: ${{ steps.merge.outputs.old-tip }}
          CHILDREN: ${{ steps.merge.outputs.children }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q --prune origin

          restack_help() {
            printf 'The PR this one was stacked on was rebased onto `%s`, and replaying this branch on top of it conflicts. Restack it by hand (or ask `@claude` here):\n\n```\ngit fetch origin\ngit rebase --onto %s %s %s\ngit push --force-with-lease\n```\n\nThen remove the `needs-restack` label.\n' "${2#origin/}" "$2" "$3" "$1"
          }

          # Each entry: PR number | branch | old tip to cut at | ref to replay onto.
          queue=()
          while IFS=$'\t' read -r num branch; do
            queue+=("$num|$branch|$OLD_TIP|origin/$BASE")
          done < <(jq -r '.[] | [.number, .branch] | @tsv' <<< "$CHILDREN")

          i=0
          while [ "$i" -lt "${#queue[@]}" ]; do
            IFS='|' read -r num branch cut onto <<< "${queue[$i]}"
            i=$((i + 1))

            # GitHub retargets the PRs of a deleted branch to its base; make sure of it.
            if [ "$onto" = "origin/$BASE" ]; then
              gh pr edit "$num" --repo "$REPO" --base "$BASE" > /dev/null 2>&1 || true
            fi

            if ! before=$(git rev-parse -q --verify "origin/$branch"); then
              echo "::warning::PR #$num: branch $branch no longer exists."
              continue
            fi
            git switch -q -C "$branch" "$before"

            if git rebase -q --onto "$onto" "$cut"; then
              git push -q --force-with-lease="$branch:$before" origin "$branch"
              echo "Restacked PR #$num ($branch) onto ${onto#origin/}."
              # Its own children carry its old commits: restack them onto its new tip.
              while IFS=$'\t' read -r cnum cbranch; do
                [ -n "$cnum" ] && queue+=("$cnum|$cbranch|$before|origin/$branch")
              done < <(gh pr list --repo "$REPO" --base "$branch" --state open --json number,headRefName --jq '.[] | [.number, .headRefName] | @tsv')
            else
              git rebase --abort
              gh label create needs-restack --repo "$REPO" --color D93F0B --description "Stacked PR the bot could not rebase onto its new base" > /dev/null 2>&1 || true
              gh pr edit "$num" --repo "$REPO" --add-label needs-restack > /dev/null
              gh pr comment "$num" --repo "$REPO" --body "$(restack_help "$branch" "$onto" "$cut")"
              echo "::warning::PR #$num ($branch) conflicts with its new base; labeled needs-restack."
            fi
          done
