# Reusable: Claude reviews the PR against the Labsky standard and the project's CLAUDE.md.
#
# Runs the labsky plugin's review-pr skill (the same one developers run locally), posts its
# findings as inline comments plus one summary comment, and fails when any CRITICAL remains,
# so the merge bot does not merge the PR. Promotion PRs (dev→staging, staging→main) are
# skipped: every change in them was reviewed on its way into dev.
#
# Secret: claude-code-oauth-token (from `claude setup-token`, billed to the Claude plan).
# Needs the Claude GitHub App installed on the repository.
#
#   jobs:
#     ai-review:
#       uses: labsky-studios/labsky-standards/.github/workflows/ai-review.yml@v1
#       secrets:
#         claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#         vault-token: ${{ secrets.MERGE_BOT_TOKEN }}
name: AI review

on:
  workflow_call:
    inputs:
      model:
        description: Model the reviewer runs on.
        type: string
        default: "claude-sonnet-5-5"
      max-turns:
        description: Upper bound on the reviewer's turns.
        type: number
        default: 40
    secrets:
      claude-code-oauth-token:
        required: true
      vault-token:
        description: Token with read access to labsky-studios/labsky-vault (the repo's MERGE_BOT_TOKEN, with the vault added to it), so the review applies the client's brand and copy rules.
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false && github.head_ref != 'dev' && github.head_ref != 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The client's and project's memory (brand, copy rules, decisions). The plugin's
      # SessionStart hook reads it from LABSKY_VAULT_DIR, as it does on a developer's machine.
      - name: Check for vault access
        id: vault
        env:
          HAS_VAULT_TOKEN: ${{ secrets.vault-token != '' }}
        run: |
          if [ "$HAS_VAULT_TOKEN" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No vault-token: the review runs without the client's brand and copy rules."
          fi

      - uses: actions/checkout@v4
        if: steps.vault.outputs.enabled == 'true'
        continue-on-error: true
        with:
          repository: labsky-studios/labsky-vault
          token: ${{ secrets.vault-token }}
          path: .vault

      - name: Expose the vault
        if: steps.vault.outputs.enabled == 'true'
        run: |
          if [ -d .vault/clients ]; then
            echo "LABSKY_VAULT_DIR=$GITHUB_WORKSPACE/.vault" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not check out labsky-vault: add it to the token's repositories."
          fi

      - name: Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude-code-oauth-token }}
          plugin_marketplaces: |
            https://github.com/labsky-studios/labsky-standards.git
          plugins: |
            labsky@labsky
          use_sticky_comment: "true"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.base_ref }}

            Review this pull request with the labsky:review-pr skill, passing it the PR number.
            The project's CLAUDE.md, the Labsky docs and, for visible content, the project memory
            loaded at session start (the client's brand.md and the project's copy-rules.md in the vault)
            are the only review criteria.

            Then:
            1. Post each CRITICAL and WARNING finding as an inline comment on its line with
               mcp__github_inline_comment__create_inline_comment (confirmed: true), quoting the
               rule it breaks and the fix.
            2. Post the whole report as one PR comment with `gh pr comment`, ending with the
               skill's summary line.
            3. Return the counts in the structured output.

            Do not modify files, push, approve or merge.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "Read,Grep,Glob,Skill,Bash(gh api repos/labsky-studios/labsky-vault/*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"critical":{"type":"integer"},"warnings":{"type":"integer"},"suggestions":{"type":"integer"},"summary":{"type":"string"}},"required":["critical","warnings","suggestions","summary"]}'

      - name: Gate on critical findings
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "::error::The review returned no result. Re-run the job; if it keeps failing, check the Claude token."
            exit 1
          fi
          critical=$(echo "$RESULT" | jq -r '.critical')
          echo "$(echo "$RESULT" | jq -r '.summary')" >> "$GITHUB_STEP_SUMMARY"
          if [ "$critical" != "0" ]; then
            echo "::error::$critical critical finding(s). Fix them, or reply on the PR if a finding is wrong."
            exit 1
          fi
